<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IP2Live Gameplay 4.5 Preview</title>
  <style>
    @font-face {
      font-family: "Abnes";
      src: url("../../Fonts/abnes.ttf") format("truetype");
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02050b;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720" aria-label="Gameplay 4.5 Host Power Reactor preview"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    window.IP2Live = {
      Assets: { abnesLoaded: true },
      GameplayCompletionPopup: null,
      DialogueManager: null,
      GameManager: null,
      MusicManager: null,
      QuestManager: null,
    };
    window.Scene = {
      Base: class {
        constructor(loading) {
          this.loading = !!loading;
          if (this.loading && typeof this.load === 'function') this.load();
        }
      },
    };
    window.Manager = {
      Stack: { requestPaintHUD: false, push() {}, pop() {}, replace() {} },
      GL: {},
    };
    window.Common = {
      Platform: { ctx },
      ScreenResolution: { SCREEN_X: 1280, SCREEN_Y: 720 },
    };
    window.Core = { Game: { current: { currentMapID: 11 } } };
    window.Data = {
      Keyboards: { checkCancelMenu() { return false; } },
      Systems: {
        soundCursor: { playSound() {} },
        soundCancel: { playSound() {} },
        soundConfirmation: { playSound() {} },
        soundImpossible: { playSound() {} },
      },
    };
    window.Graphic = {};
    window.Model = {};
    window.Main = {};
    window.THREE = {};
    window.inject = function () {};

    function resize() {
      const pixelRatio = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.max(640, Math.round(window.innerWidth * pixelRatio));
      canvas.height = Math.max(360, Math.round(window.innerHeight * pixelRatio));
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
    }
    resize();
    window.addEventListener('resize', resize);
  </script>
  <script src="../../Plugins/IP2Live_Core/gameplay/gameplay4_5/HostPowerReactor/ip_host_power_gameplay.js"></script>
  <script>
    const preview = new IP2Live.HostPowerReactorGameplayScreen({
      targetClass: 'C',
      requiredHosts: 50,
      durationSeconds: 60,
      guidedTutorial: window.location.hash.indexOf('#tutorial-') === 0,
    });
    window.hostPowerPreview = preview;

    window.addEventListener('keydown', (event) => preview.onKeyPressedAndRepeat({
      name: event.key,
      code: event.code,
    }));
    window.addEventListener('keyup', (event) => preview.onKeyReleased({
      name: event.key,
      code: event.code,
    }));
    window.addEventListener('mousemove', (event) => {
      const rect = canvas.getBoundingClientRect();
      preview.onMouseMove(
        (event.clientX - rect.left) * canvas.width / rect.width,
        (event.clientY - rect.top) * canvas.height / rect.height
      );
    });
    window.addEventListener('mousedown', (event) => {
      const rect = canvas.getBoundingClientRect();
      preview.onMouseDown(
        (event.clientX - rect.left) * canvas.width / rect.width,
        (event.clientY - rect.top) * canvas.height / rect.height
      );
    });

    if (window.location.hash === '#showcase') {
      preview.update();
      const showcaseMetrics = preview._metrics();
      preview.entities = [];
      preview.laneCursor = 0;
      preview.dropCursor = 0;
      preview.nextSpawnAt = 0;
      for (let index = 0; index < 5; index++) {
        preview._updateSpawner(showcaseMetrics, index * preview.spawnIntervalMs);
        preview.entities[index].y = showcaseMetrics.arena.y + (92 + index * 78) * showcaseMetrics.scale;
      }
      preview.nextSpawnAt = Date.now() + 10000;
      preview.bullets = [{
        x: showcaseMetrics.arena.x + showcaseMetrics.arena.w * 0.5,
        y: showcaseMetrics.arena.y + showcaseMetrics.arena.h - 115 * showcaseMetrics.scale,
        radius: 3.4 * showcaseMetrics.scale,
        speed: 390 * showcaseMetrics.scale,
      }];
    }

    if (window.location.hash.indexOf('#tutorial-') === 0) {
      preview.tutorialStep = 'preview_hold';
      preview.tutorialPaused = true;
      preview.tutorialComplete = false;
      preview.roundState = 'tutorial';
      preview.tutorialHighlight = {
        type: window.location.hash.slice('#tutorial-'.length) || 'shell',
        label: '04 // ONE SHOT BURSTS TARGET',
      };
    }

    function frame() {
      preview.update();
      preview.drawHUD();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
