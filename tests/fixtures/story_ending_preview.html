<!doctype html>
<html><head><meta charset="utf-8"><title>IP2Live Story Ending Preview</title>
<style>
@font-face { font-family: Oxanium-Medium; src: url('../../Fonts/Oxanium-Medium.ttf'); }
html, body { margin: 0; width: 100%; height: 100%; background: #03080d; overflow: hidden; }
canvas { width: 100vw; height: 100vh; display: block; }
</style></head><body><canvas id="preview"></canvas><script>
const params = new URLSearchParams(location.search), canvas = document.getElementById('preview');
canvas.width = Number(params.get('w')) || innerWidth; canvas.height = Number(params.get('h')) || innerHeight;
const Common = { Platform: { ctx: canvas.getContext('2d') } }, Core = { Game: { current: null } };
const Manager = { Stack: { requestPaintHUD: true, pop() {}, popAll() {}, pushTitleScreen() {} } };
const Scene = { Base: class { constructor() { this.initialize(); } initialize() {} close() {} } };
const Data = { Systems: {}, Keyboards: { checkActionMenu: key => key === 'Enter', checkCancelMenu: key => key === 'Escape' } };
const IP2Live = { Assets: { loadPauseFonts: () => document.fonts.load('18px Oxanium-Medium') }, MusicManager: { play() {} } };
const record = { version: 1, mode: 'story', status: 'completed', id: 'story-2026-nova', storyRunId: 'story-2026-nova',
    name: params.get('state') === 'long' ? 'Alexandria Montgomery 王' : 'NOVA', completedAt: Date.UTC(2026, 9, 12), finalMapId: 18, floors: 16 };
(async () => {
    for (const file of ['certificate_pdf.js', 'story_completion.js', 'story_certificate.js', 'screens/story-ending.js']) {
        const response = await fetch('../../Plugins/IP2Live_Core/modules/' + file);
        if (!response.ok) throw new Error('Preview source could not be loaded: ' + file);
        new Function('Common','Core','Data','Manager','Scene','IP2Live','window', await response.text())(Common,Core,Data,Manager,Scene,IP2Live,window);
    }
    const state = params.get('state') || 'complete';
    IP2Live.StoryCompletion.list = async () => state === 'empty' ? [] : [record];
    const scene = new IP2Live.StoryEndingScreen(record, { certificateOnly: !['cutscene','apex','restored'].includes(state), archive: ['archive','empty'].includes(state) });
    await scene.load(); scene.beat = state === 'apex' ? 1 : state === 'restored' ? 2 : Number(params.get('beat')) || 0; scene.beatStarted = Date.now() - 4000;
    await document.fonts.ready;
    if (state === 'certificate') {
        IP2Live.StoryCertificate.draw(canvas.getContext('2d'), record);
        const certificate = IP2Live.StoryCertificate.create(record), bytes = new Uint8Array(await certificate.blob.arrayBuffer());
        const binary = Array.from(bytes, byte => String.fromCharCode(byte)).join('');
        const pdf = document.createElement('textarea'); pdf.id = 'certificate-pdf'; pdf.hidden = true; pdf.textContent = btoa(binary); document.body.appendChild(pdf);
    } else scene.drawHUD();
    document.body.dataset.previewState = 'ready';
    addEventListener('keydown', event => { scene.onKeyPressed(event.key); scene.drawHUD(); });
    canvas.onpointermove = event => { scene.onMouseMove(event.clientX * canvas.width / innerWidth, event.clientY * canvas.height / innerHeight); scene.drawHUD(); };
    window.previewScene = scene; window.previewCertificate = () => IP2Live.StoryCertificate.create(record);
})().catch(error => { document.body.dataset.previewState = 'error'; document.body.dataset.previewError = error.message; console.error(error); });
</script></body></html>
